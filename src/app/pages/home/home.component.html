<div class="page">
  <header class="header">
    <div class="greeting">
      <span class="hello">Hola, {{ username }}</span>
      <span class="title">Tus deseos</span>
    </div>
    <div class="header-actions">
      <div class="avatar">{{ avatarInitial }}</div>
      <button mat-icon-button aria-label="Cerrar sesión" matTooltip="Cerrar sesión" (click)="logOut()">
        <mat-icon>logout</mat-icon>
      </button>
    </div>
  </header>

  <div class="segmented" role="tablist">
    <button
      role="tab"
      class="segment"
      [class.active]="activeTab === 'lists'"
      [attr.aria-selected]="activeTab === 'lists'"
      (click)="activeTab = 'lists'"
    >Mis listas</button>
    <button
      role="tab"
      class="segment"
      [class.active]="activeTab === 'groups'"
      [attr.aria-selected]="activeTab === 'groups'"
      (click)="activeTab = 'groups'"
    >Grupos</button>
  </div>

  <div class="content">
    @if (activeTab === 'lists') {
      <app-list></app-list>
    } @else {
      <app-groups></app-groups>
    }
  </div>
</div>
<app-loader></app-loader>
<app-footer></app-footer>

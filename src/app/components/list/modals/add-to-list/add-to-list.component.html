<h2 mat-dialog-title>Añadir a la lista</h2>
<mat-dialog-content>
  <form [formGroup]="addToListForm">
    <div class="form">
      <div class="field-group">
        <label class="field-label" for="add-title">Titulo</label>
        <input id="add-title" class="field-input" formControlName="title" />
        @if (addToListForm.controls['title'].touched && addToListForm.controls['title'].invalid) {
          <span class="field-error">Este campo es obligatorio</span>
        }
      </div>

      <div class="field-group">
        <label class="field-label" for="add-description">Descripción</label>
        <textarea
          id="add-description"
          class="field-textarea"
          formControlName="description"
          placeholder="De color morado..."
        ></textarea>
      </div>

      <div class="field-group">
        <label class="field-label" for="add-url">Link</label>
        <input id="add-url" class="field-input" formControlName="url" />
      </div>

      <div class="image-field">
        <button class="pill-button pill-button--ghost" type="button" (click)="imageInput.click()">
          <mat-icon>image</mat-icon> {{ selectedImage ? 'Cambiar imagen' : 'Añadir imagen' }}
        </button>
        <input #imageInput type="file" accept="image/*" hidden (change)="onImageSelected($event)" />
        @if (imagePreviewUrl) {
          <img class="image-preview" [src]="imagePreviewUrl" alt="Previsualización" />
        }
      </div>
    </div>
  </form>
</mat-dialog-content>
<mat-dialog-actions>
  <button class="pill-button pill-button--ghost" mat-dialog-close>Cancelar</button>
  <button
    class="pill-button"
    (click)="submit()"
    [disabled]="addToListForm.invalid"
  >
    Añadir a la lista
  </button>
</mat-dialog-actions>

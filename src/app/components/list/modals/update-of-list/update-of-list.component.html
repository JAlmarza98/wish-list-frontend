<h2 mat-dialog-title>Modificar articulo de la lista</h2>
<mat-dialog-content>
  <form [formGroup]="updateOfList">
    <div class="form">
      <div>
        <mat-form-field>
          <mat-label>Titulo</mat-label>
          <input matInput formControlName="title" />
          <mat-error>Este campo es obligatorio</mat-error>
        </mat-form-field>
      </div>

      <div>
        <mat-form-field>
          <mat-label>Descripción</mat-label>
          <textarea
            matInput
            formControlName="description"
            placeholder="De color morado..."
          ></textarea>
        </mat-form-field>
      </div>

      <div>
        <mat-form-field>
          <mat-label>Link</mat-label>
          <input matInput formControlName="url" />
        </mat-form-field>
      </div>

      <div>
        <button mat-stroked-button type="button" (click)="imageInput.click()">
          <mat-icon>image</mat-icon> {{ imagePreviewUrl ? 'Cambiar imagen' : 'Añadir imagen' }}
        </button>
        @if (imagePreviewUrl) {
          <button mat-icon-button type="button" (click)="clearImage()" matTooltip="Quitar imagen">
            <mat-icon>delete</mat-icon>
          </button>
        }
        <input #imageInput type="file" accept="image/*" hidden (change)="onImageSelected($event)" />
        @if (imagePreviewUrl) {
          <img class="image-preview" [src]="imagePreviewUrl" alt="Previsualización" />
        }
      </div>
    </div>
  </form>
</mat-dialog-content>
<mat-dialog-actions>
  <button mat-button mat-dialog-close>Cancelar</button>
  <button
    mat-flat-button
    (click)="submit()"
    [disabled]="updateOfList.invalid"
  >
    Modificar artículo
  </button>
</mat-dialog-actions>

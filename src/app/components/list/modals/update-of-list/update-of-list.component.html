<h2 mat-dialog-title>Modificar articulo de la lista</h2>
<mat-dialog-content>
  <form [formGroup]="updateOfList">
    <div class="form">
      <div class="field-group">
        <label class="field-label" for="update-title">Titulo</label>
        <input id="update-title" class="field-input" formControlName="title" />
        @if (updateOfList.controls['title'].touched && updateOfList.controls['title'].invalid) {
          <span class="field-error">Este campo es obligatorio</span>
        }
      </div>

      <div class="field-group">
        <label class="field-label" for="update-description">Descripción</label>
        <textarea
          id="update-description"
          class="field-textarea"
          formControlName="description"
          placeholder="De color morado..."
        ></textarea>
      </div>

      <div class="field-group">
        <label class="field-label" for="update-url">Link</label>
        <input id="update-url" class="field-input" formControlName="url" />
      </div>

      <div class="image-field">
        <div class="image-field-actions">
          <button class="pill-button pill-button--ghost" type="button" (click)="imageInput.click()">
            <mat-icon>image</mat-icon> {{ imagePreviewUrl ? 'Cambiar imagen' : 'Añadir imagen' }}
          </button>
          @if (imagePreviewUrl) {
            <button class="icon-ghost-button" type="button" (click)="clearImage()" matTooltip="Quitar imagen">
              <mat-icon>delete</mat-icon>
            </button>
          }
        </div>
        <input #imageInput type="file" accept="image/*" hidden (change)="onImageSelected($event)" />
        @if (imagePreviewUrl) {
          <img class="image-preview" [src]="imagePreviewUrl" alt="Previsualización" />
        }
      </div>
    </div>
  </form>
</mat-dialog-content>
<mat-dialog-actions>
  <button class="pill-button pill-button--ghost" mat-dialog-close>Cancelar</button>
  <button
    class="pill-button"
    (click)="submit()"
    [disabled]="updateOfList.invalid"
  >
    Modificar artículo
  </button>
</mat-dialog-actions>

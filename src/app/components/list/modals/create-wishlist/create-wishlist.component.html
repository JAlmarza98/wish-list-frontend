<h2 mat-dialog-title>Crear lista</h2>
<mat-dialog-content>
  <form [formGroup]="createWishlistForm">
    <div class="field-group">
      <label class="field-label" for="wishlist-name">Nombre de la lista</label>
      <input id="wishlist-name" class="field-input" formControlName="name" placeholder="Cumpleaños, Navidad..." />
      @if (createWishlistForm.controls['name'].touched && createWishlistForm.controls['name'].invalid) {
        <span class="field-error">Este campo es obligatorio</span>
      }
    </div>
  </form>
</mat-dialog-content>
<mat-dialog-actions>
  <button class="pill-button pill-button--ghost" mat-dialog-close>Cancelar</button>
  <button
    class="pill-button"
    [mat-dialog-close]="createWishlistForm.value"
    [disabled]="createWishlistForm.invalid"
  >
    Crear lista
  </button>
</mat-dialog-actions>

<div class="container">
  @if (loadReady && groupsList.length === 0) {
    <div class="empty-state">
      <span>Parece que no estas en ningun grupo</span>
      <button class="pill-button" (click)="createNewGroup()">Crear tu primer grupo</button>
    </div>
  }

  @if (loadReady && groupsList.length !== 0) {
    <div class="section-head">
      <span class="section-title">Tus grupos</span>
    </div>
    <div class="groups-grid">
      @for (item of groupsList; track item.id) {
        <a class="group-chip" [routerLink]="'/group/'+ item.id">
          <div class="group-avatar">{{ item.name.charAt(0).toUpperCase() }}</div>
          <div class="group-meta">
            <span class="group-name">{{ item.name }}</span>
            <span class="group-count">{{ item.member_count }} miembros</span>
          </div>
        </a>
      }
      <button class="group-chip group-chip--create" (click)="createNewGroup()">
        <mat-icon>add</mat-icon>
        <span class="group-name">Crear grupo</span>
      </button>
    </div>
  }
</div>

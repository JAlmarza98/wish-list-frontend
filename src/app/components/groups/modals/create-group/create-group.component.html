<h2 mat-dialog-title>Crear grupo</h2>
<mat-dialog-content>
  <form [formGroup]="createGroupForm">
    <div class="field-group">
      <label class="field-label" for="group-name">Nombre del grupo</label>
      <input id="group-name" class="field-input" formControlName="name" />
      @if (createGroupForm.controls['name'].touched && createGroupForm.controls['name'].invalid) {
        <span class="field-error">Este campo es obligatorio</span>
      }
    </div>
  </form>
</mat-dialog-content>
<mat-dialog-actions>
  <button class="pill-button pill-button--ghost" mat-dialog-close>Cancelar</button>
  <button
    class="pill-button"
    [mat-dialog-close]="createGroupForm.value"
    [disabled]="createGroupForm.invalid"
  >
    Crear grupo
  </button>
</mat-dialog-actions>

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Generado al arrancar el contenedor (docker-entrypoint.d/30-wishu-env.sh):
    # el navegador debe revalidarlo siempre, nunca servirlo de caché.
    location = /config/env.js {
        add_header Cache-Control "no-cache";
    }
}
